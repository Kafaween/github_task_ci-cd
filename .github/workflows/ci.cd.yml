name: Github_task CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/ci.cd.yml'
    tags:
      - 'v*.*.*'

  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/ci.cd.yml'

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. Backend tests - Node.js 18, 20, and 22
  # ============================================================
  test_matrix:
    name: Test Backend - Node ${{ matrix.node-version }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test


  # ============================================================
  # 2. SonarQube code analysis
  #    Runs in parallel with test_matrix
  # ============================================================
  sonarqube_analysis:
    name: SonarQube Analysis

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install backend dependencies
        working-directory: src/backend
        run: npm ci

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ============================================================
  # 3. Simulated deployment
  #    Runs only when BOTH previous jobs succeed
  # ============================================================
  simulate_deployment:
    name: Simulate Deployment

    needs:
      - test_matrix
      - sonarqube_analysis

    runs-on: ubuntu-latest

    steps:
      - name: Simulate production deployment
        run: |
          echo "======================================"
          echo "Starting simulated deployment..."
          echo "======================================"
          echo "All tests passed."
          echo "SonarQube analysis passed."
          echo "Deploying application..."
          echo "Application deployment simulated successfully."
          echo "======================================"   

  # ============================================================
  # 4. Create GitHub Release
  #    Runs only for version tags such as v1.0.0
  # ============================================================
  create_release:
    name: Create GitHub Release

    needs:
      - simulate_deployment

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true             